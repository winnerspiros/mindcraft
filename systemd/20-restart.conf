# The bot rides out a MINECRAFT SERVER RESTART on its own.
#
# WHY THIS EXISTS: the unit already declares Wants=minecraft-fabric.service with the
# intent "the bot self-heals its own connection via systemd restart". The old limit
# (Burst=4 / Interval=300) DEFEATED that intent: each server restart drops her
# connection, she exits, systemd retries, and the 5th attempt inside 300s parked the
# service in `failed` with "Start request repeated too quickly". On a 1-OCPU box a
# server restart cycle alone produced five attempts, so she stayed down until a human
# ran `systemctl reset-failed` -- which reads exactly like "the bot doesn't
# auto-connect" and is not a connect bug.
#
# WHAT CHANGED: only the RATE LIMIT window, not the retry behaviour. Restart=on-failure
# with RestartSec=15 is untouched, so a genuine crash loop still gets throttled and
# still stops after a burst -- it just has to do so over a realistic window instead of
# one that a normal restart exhausts.
#
# WIDTH: 12 tries per 30 minutes. A server restart cycle on this box produces ~5
# attempts (~2.5 min of retries at RestartSec=15). That leaves >2x headroom for a
# genuinely stuck server while still bounding a true crash loop: 12 attempts at
# RestartSec=15 is ~3 min of actual work, not 30 min, so the wall-clock cost of a real
# fault is unchanged. 30 min is the window, not the retry spacing.
#
# Do NOT set StartLimitAction=none. That would also disable the limiter for genuine
# crashes, which is the protection this file exists to keep. boot.sh now waits for the
# server port before connecting, which removes most wasted attempts in the first place.
[Unit]
StartLimitBurst=12
StartLimitIntervalSec=1800